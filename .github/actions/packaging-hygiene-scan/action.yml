name: Packaging hygiene scan
description: >-
  Scan recent CI job logs across curated DLRSP package repos for recurring
  packaging and deprecation warnings; open or update one tracking issue per
  (repo, warning class) using an App token with issues:write.
inputs:
  org:
    description: Organization login that owns the packages
    required: false
    default: DLRSP
  github-token:
    description: App token with issues:write and actions:read on target repos
    required: true
  fleet-file:
    description: Path to fleet-modules.yaml (relative to workspace root)
    required: false
    default: .github/fleet-modules.yaml
  repos:
    description: Optional CSV of repo names (overrides fleet file)
    required: false
    default: ""
  runs-per-repo:
    description: Completed CI runs to inspect per repository
    required: false
    default: "3"
  workflow-name:
    description: Substring filter for workflow run name
    required: false
    default: CI/CD
  dry-run:
    description: When "1", report actions without writing issues
    required: false
    default: ""
outputs:
  issue-count:
    description: Number of issues created or updated
    value: ${{ steps.scan.outputs.issue-count }}
  issue-urls:
    description: Newline-separated issue URLs
    value: ${{ steps.scan.outputs.issue-urls }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install scanner dependencies
      shell: bash
      run: python -m pip install --quiet pyyaml

    - name: Scan CI logs and upsert issues
      id: scan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ORG: ${{ inputs.org }}
        FLEET_FILE: ${{ inputs.fleet-file }}
        REPOS: ${{ inputs.repos }}
        RUNS_PER_REPO: ${{ inputs.runs-per-repo }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: python "${{ github.action_path }}/packaging_hygiene_scan.py"
